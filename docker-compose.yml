# LS-Matchmaker – lokale Entwicklungsumgebung (isoliert; eigene Namen/Volume, kein Host-Port).
services:
  db:
    image: postgres:16
    container_name: lsm_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lsm_web
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    # AP3: Entwicklungs-Server. Nur auf localhost gebunden (kein öffentlicher Zugang;
    # der kommt erst in AP6). Host-Port über ENV (WEB_PORT) überschreibbar, falls 8000 belegt.
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"

volumes:
  lsm_pgdata:
