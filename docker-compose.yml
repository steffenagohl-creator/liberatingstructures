# LS-Matchmaker – lokale Entwicklungsumgebung (isoliert; eigene Namen/Volume, kein Host-Port).
services:
  db:
    image: postgres:16
    container_name: lsm_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lsm_web
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    working_dir: /app/backend
    # In AP2 kein Host-Port nötig; in AP3/AP6 wird hier 8000 freigegeben.

volumes:
  lsm_pgdata:
