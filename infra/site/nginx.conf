# LS-Auslieferungs-Container — zeigt die gebaute Web-App + reicht /api an Django weiter.
# Läuft hinter einem Reverse-Proxy (der TLS/Domain macht); selbst nur HTTP intern.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;     # der Vite-Build (frontend/dist)
    index index.html;

    # API gleiche Origin → kein CORS nötig. Ziel = Django-Service "web" im LS-Netz.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Das LLM-Matchmaking (mit Verdichtung) braucht teils >60s → großzügiger Timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # index.html NIE cachen — sie verweist auf die gehashten Asset-Dateinamen. Würde der Browser
    # eine alte index.html cachen, lädt er ein veraltetes Bundle (Symptom 2026-06-06: neue
    # Frontend-Builds kamen erst nach hartem Reload an). Die gehashten Assets selbst dürfen lange
    # gecacht bleiben (neuer Build = neuer Dateiname = automatisch frisch).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Single-Page-App: unbekannte Pfade auf index.html (Client-seitiges Routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
