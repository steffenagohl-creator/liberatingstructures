# LS-Auslieferungs-Container — zeigt die gebaute Web-App + reicht /api an Django weiter.
# Läuft hinter einem Reverse-Proxy (der TLS/Domain macht); selbst nur HTTP intern.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;     # der Vite-Build (frontend/dist)
    index index.html;

    # API gleiche Origin → kein CORS nötig. Ziel = Django-Service "web" im LS-Netz.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Das LLM-Matchmaking (mit Verdichtung) braucht teils >60s → großzügiger Timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # Single-Page-App: unbekannte Pfade auf index.html (Client-seitiges Routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
