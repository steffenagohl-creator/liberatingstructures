# LS-Auslieferungs-Container — zeigt Landing-Page + Web-App + reicht /api an Django weiter.
# Läuft hinter einem Reverse-Proxy (der TLS/Domain macht); selbst nur HTTP intern.
#
# Aufbau (eine gemeinsame frontend/dist):
#   /            → index.html  = Landing-Page (statisch, aus frontend/public/)
#   /app.html    → die React/Vite-App (eigener Einstieg, gehashte Bundles)
#   /api/        → Django-Backend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;     # der Vite-Build (frontend/dist)
    index index.html;

    # API gleiche Origin → kein CORS nötig. Ziel = Django-Service "web" im LS-Netz.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Das LLM-Matchmaking (mit Verdichtung) braucht teils >60s → großzügiger Timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # index.html (Landing) und app.html (App-Einstieg) NIE cachen. app.html verweist auf die
    # gehashten Asset-Dateinamen — würde der Browser eine alte Version cachen, lädt er ein
    # veraltetes Bundle (Symptom 2026-06-06: neue Frontend-Builds kamen erst nach hartem Reload
    # an). Die gehashten Assets selbst dürfen lange gecacht bleiben (neuer Build = neuer
    # Dateiname = automatisch frisch).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    location = /app.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Statische Dateien direkt ausliefern; unbekannte Pfade fallen auf die Landing-Page zurück.
    # (Die App nutzt kein Pfad-Routing, sondern den Query-Parameter ?phase= — daher kein
    # SPA-Catch-all auf app.html nötig.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
